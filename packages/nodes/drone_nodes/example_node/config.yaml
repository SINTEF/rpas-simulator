# How this package is loaded: config/drone.yaml includes this file (one `include:` line).
# Its object is on swarm.bus because others call it (ARCHITECTURE.md section 3), one per drone:
# example_drone<ID> with a droneId. It reads its drone's flight_controller on droneBus, never sim.bus.
build:
  - name: exampleNodeComponent
    group: 4                 # starts after airframe (2); the list is empty until flight_controller appears
    freqHz: 10
    imports: [example_node]
    objects:
      - name: example_drone@env(DRONE_ID)
        class: example_node.ExampleNodeImpl
        bus: swarm.bus
        droneId: "@env(DRONE_ID)"
        droneBus: drone@env(DRONE_ID).bus
